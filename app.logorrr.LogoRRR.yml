app-id: app.logorrr.LogoRRR
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.openjdk25
command: LogoRRR
finish-args:
  - --socket=x11
  - --share=ipc
  - --device=dri
  - --filesystem=host:ro
modules:
  - name: openjdk
    buildsystem: simple
    build-commands:
      - /usr/lib/sdk/openjdk25/install.sh
  - name: LogoRRR
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/openjdk25/bin
      env:
        JAVA_HOME: /usr/lib/sdk/openjdk25
    build-commands:
      - mvn clean package -pl "app.logorrr.dist.linux:app-image" -am -B -Dmaven.repo.local=./offline-repository --offline -Denforcer.skip=true
      - mkdir -p /app/bin
      - cp -ar dist/linux/app-image/target/classes/LogoRRR/lib /app/
      - cp -ar dist/linux/app-image/target/classes/LogoRRR/bin/LogoRRR /app/bin/
      - install -Dm644 app-icons/src/main/resources/logorrr-icon-16.png /app/share/icons/hicolor/16x16/apps/app.logorrr.LogoRRR.png
      - install -Dm644 app-icons/src/main/resources/logorrr-icon-32.png /app/share/icons/hicolor/32x32/apps/app.logorrr.LogoRRR.png
      - install -Dm644 app-icons/src/main/resources/logorrr-icon-64.png /app/share/icons/hicolor/64x64/apps/app.logorrr.LogoRRR.png
      - install -Dm644 app-icons/src/main/resources/logorrr-icon-128.png /app/share/icons/hicolor/128x128/apps/app.logorrr.LogoRRR.png
      - install -Dm644 app-icons/src/main/resources/logorrr-icon-256.png /app/share/icons/hicolor/256x256/apps/app.logorrr.LogoRRR.png
      - install -Dm644 app-icons/src/main/resources/logorrr-icon-512.png /app/share/icons/hicolor/512x512/apps/app.logorrr.LogoRRR.png
      - install -Dm644 dist/linux/flatpak/app.logorrr.LogoRRR.metainfo.xml /app/share/metainfo/app.logorrr.LogoRRR.metainfo.xml
      - install -Dm644 dist/linux/flatpak/app.logorrr.LogoRRR.desktop -t /app/share/applications
    sources:
      - type: git
        url: https://github.com/rladstaetter/LogoRRR.git
        branch: 281-create-from-source-build
#        commit: 66d56a8816b4cdf09daf25301eb8480cecdea26e
      - type: archive
        url: https://download2.gluonhq.com/openjfx/26/openjfx-26_linux-aarch64_bin-jmods.zip
        sha256: c534512cbae32e186b7d8b0661149e6412ff8b9fe26124a4efd347b5fc028f30
        dest: "env/target/javafx-jmods-26"
        only-arches: [aarch64]
      - type: archive
        url: https://download2.gluonhq.com/openjfx/26/openjfx-26_linux-x64_bin-jmods.zip
        sha256: 96e520f48610d8ffb94ca30face1f11ffe8a977ddc1c4ff80b1a9e9f048bd94e
        dest: "env/target/javafx-jmods-26"
        only-arches: [x86_64]
      - maven-dependencies-aarch64.yml
